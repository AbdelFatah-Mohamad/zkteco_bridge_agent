{% extends "base.html" %}
{% block body %}
<h1>{{ t('settings') }}</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="odoo_base_url">{{ t('odoo_url') }}</label>
  <input id="odoo_base_url" name="odoo_base_url" value="{{ values.odoo_base_url }}">
  <label for="token">{{ t('token') }}</label>
  <input id="token" name="token" value="" autocomplete="off" placeholder="••••••••">
  <label for="bridge_label">{{ t('label') }}</label>
  <input id="bridge_label" name="bridge_label" value="{{ values.bridge_label }}">
  <label for="poll_interval_s">{{ t('poll_override') }}</label>
  <input id="poll_interval_s" name="poll_interval_s" value="{{ values.poll_interval_s or '' }}">
  <label for="log_level">{{ t('log_level') }}</label>
  <select id="log_level" name="log_level">
    {% for level in ['INFO', 'DEBUG', 'WARNING'] %}
    <option value="{{ level }}" {% if values.log_level == level %}selected{% endif %}>{{ level }}</option>
    {% endfor %}
  </select>
  <label for="ui_lang">{{ t('language') }}</label>
  <select id="ui_lang" name="ui_lang">
    {% for code in languages %}
    <option value="{{ code }}" {% if values.ui_lang == code %}selected{% endif %}>{{ code }}</option>
    {% endfor %}
  </select>
  <button type="submit">{{ t('save') }}</button>
</form>
{% endblock %}
